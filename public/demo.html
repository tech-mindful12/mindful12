<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mindful12 — embed demo</title>
  <style>
    body { margin: 0; padding: 32px 16px; background: #F1F3F8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0D2158; }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { color: #5B6B8F; font-size: 14px; margin: 0 0 24px; }
    code { background: #fff; padding: 2px 6px; border-radius: 5px; font-size: 13px; }
    .after { margin-top: 24px; padding: 16px; background: #fff; border-radius: 5px; font-size: 14px; color: #5B6B8F; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Embed demo</h1>
    <p>This page stands in for a GHL funnel page. Add <code>?preview_type=…</code> to this URL and it flows into the form.</p>

    <!-- This is what goes into the GHL Custom HTML element -->
    <div class="mindful12-form" data-preview-type="brochure" data-bg="transparent"></div>
    <script src="embed.js"></script>

    <div class="after">Content below the form — the iframe resizes itself so this never overlaps.</div>
  </div>
  <script>
    document.addEventListener('mindful12:submitted', function (e) { console.log('submitted', e.detail); });
  </script>
</body>
</html>
